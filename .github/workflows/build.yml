name: Android CI

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - release
  pull_request:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Keystore (Debug fallback)
        run: |
          if [ -n "${{ secrets.KEY_STORE }}" ]; then
            echo androidStorePassword='${{ secrets.KEY_STORE_PASSWORD }}' >> keystore.properties
            echo androidKeyAlias='${{ secrets.ALIAS }}' >> keystore.properties
            echo androidKeyPassword='${{ secrets.KEY_PASSWORD }}' >> keystore.properties
            echo androidStoreFile='key.jks' >> keystore.properties
            echo "${{ secrets.KEY_STORE }}" | base64 --decode > app/key.jks
          else
            echo "⚠️ No keystore secrets found. Generating debug.keystore..."
            mkdir -p ~/.android
            keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            echo androidStorePassword=android >> keystore.properties
            echo androidKeyAlias=androiddebugkey >> keystore.properties
            echo androidKeyPassword=android >> keystore.properties
            echo androidStoreFile=/home/runner/.android/debug.keystore >> keystore.properties
          fi

      - name: Build with Gradle
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Get Version Name
        id: version
        run: |
          VERSION_NAME=$(grep "versionName" app/build.gradle | awk -F '"' '{print $2}' | head -n 1)
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk-${{ steps.version.outputs.version_name }}
          path: app/build/outputs/apk/release/*.apk
